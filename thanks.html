<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Message sent — Knovera</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #faf6f0;
      --fg: #111111;
      --muted: #7b7b78;
      --accent: #b46a46;
      --accent-on: #ffffff;
      --border: #dedbd6;
      --radius-lg: 34px;
      --radius-pill: 9999px;
    }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: var(--bg); color: var(--fg);
      font: 17px/1.55 Inter, system-ui, sans-serif;
      padding: 24px;
    }
    .card {
      max-width: 480px; text-align: center;
      background: #fff; border: 1px solid var(--border);
      border-radius: var(--radius-lg); padding: 40px 32px;
    }
    h1 { font-size: 28px; font-weight: 400; margin: 0 0 12px; letter-spacing: -0.03em; }
    p { color: var(--muted); margin: 0 0 24px; }
    a.btn {
      display: inline-block; background: var(--accent); color: var(--accent-on);
      text-decoration: none; padding: 10px 22px; border-radius: var(--radius-pill);
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Thanks — we got your message.</h1>
    <p>Someone from Knovera will reply to the email you sent from, usually within one business day.</p>
    <a class="btn" href="/">Back to Knovera</a>
  </div>
</body>
</html>
